# Error cases. Run one at a time.
# 1) CITY_NOT_FOUND
query NotFound {
  activityForecast(city: "Xyzzyville") { location { name } }
}

# 2) Validation error (BAD_REQUEST): country must be an ISO alpha-2 code
query BadCountry {
  activityForecast(city: "Paris", country: "France") { location { name } }
}
