# Alpine ski resort: the catalog supplies a mountain forecast target; surfing is not applicable.
query ActivityForecast {
  activityForecast(city: "Chamonix", country: "FR") {
    location { name country countryCode region latitude longitude timezone }
    dataFreshness { fetchedAt isStale }
    activities {
      activity
      bestDay
      days { date score reason }
    }
  }
}
